# Minimal Supabase CLI config. `supabase link --project-ref <ref>` connects it
# to a hosted project; see README.md for the full setup.
project_id = "hereo"

[auth.email]
# The app signs in with email + password; the sign-up function confirms accounts.
enable_signup = true
otp_length = 6

[functions.dispatch]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.ring]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.brief]
verify_jwt = true
import_map = "./functions/deno.json"

# Called every minute by pg_cron with a Vault secret, not by the app.
[functions.check-ins]
verify_jwt = false
import_map = "./functions/deno.json"

# Called before the person has an account, so there's no user token yet.
[functions.sign-up]
verify_jwt = false
import_map = "./functions/deno.json"
