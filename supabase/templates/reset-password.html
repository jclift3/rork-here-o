<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f5f3ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#141414;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f3ef;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#6b6b6b;">HereO</p>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25;">Your code is {{ .Token }}</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">Enter this code in HereO to choose a new password.</p>
                <p style="margin:0 0 24px;font-size:36px;font-weight:700;letter-spacing:0.2em;">{{ .Token }}</p>
                <p style="margin:0;font-size:14px;line-height:1.5;color:#6b6b6b;">The code expires in an hour. If you didn't ask to reset your password, you can ignore this email and nothing will change.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
